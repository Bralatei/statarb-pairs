[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "statarb"
version = "0.1.0"
description = "Walk-forward statistical arbitrage (pairs trading) research framework"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10",
  "statsmodels>=0.14",
  "matplotlib>=3.7",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
data = ["yfinance>=0.2.40"]
dev = ["pytest>=7", "ruff>=0.4"]

[project.scripts]
statarb = "statarb.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
